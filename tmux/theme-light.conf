#### COLOUR (Solarized 256 - Light)

# default statusbar colors
set-option -g status-style bg=colour230,fg=colour94,default

# default window title colors
set-window-option -g window-status-style fg=colour100,bg=colour254,default

# active window title colors
set-window-option -g window-status-current-style fg=colour31,bg=colour230,bright

# pane border
set-option -g pane-border-style fg=colour252
set-option -g pane-active-border-style fg=colour136,bg=colour230

# message text
set-option -g message-style bg=colour230,fg=colour31

# pane number display
set-option -g display-panes-active-colour colour25
set-option -g display-panes-colour colour136

# clock
set-window-option -g clock-mode-colour colour64
